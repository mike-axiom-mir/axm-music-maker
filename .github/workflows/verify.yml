name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example transition receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from axm_music import resolve_transition

          project = json.loads(Path('examples/three_state_score.json').read_text())
          receipt = resolve_transition(project, current_state='exploration', trigger='threat', request_tick=1000)
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert receipt['next_state'] == 'danger'
          assert receipt['effective_tick'] == 3840
          PY
